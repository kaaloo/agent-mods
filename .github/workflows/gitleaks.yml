name: gitleaks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: gitleaks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Scan for leaked secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Gitleaks
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --show-error --silent --location "$base/$archive" -o "$archive"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum -c -
          tar -xzf "$archive" gitleaks
          ./gitleaks version
      - name: Scan full repository history
        run: ./gitleaks git --config .gitleaks.toml --redact --no-banner .
